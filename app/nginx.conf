server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy reverso para a API: o frontend e o unico consumidor da API, entao
  # servimos as duas pelo mesmo origin. Assim o navegador sempre chama o
  # host/porta que carregou a pagina (localhost, IP da LAN, celular na rede,
  # etc.) sem depender de uma URL absoluta embutida no build.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:8000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
