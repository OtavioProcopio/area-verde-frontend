name: Frontend CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t area-verde-frontend:ci ./app
        working-directory: ..
