name: Frontend CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - "feature/**"
      - "bugfix/**"
      - "docs/**"
      - "chore/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t area-verde-frontend:ci .

  open-pr:
    name: Open PR to develop
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/feature/') ||
       startsWith(github.ref, 'refs/heads/bugfix/') ||
       startsWith(github.ref, 'refs/heads/docs/') ||
       startsWith(github.ref, 'refs/heads/chore/'))

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure PR to develop exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.ref_name }}"

          existing=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base develop \
            --head "$branch" \
            --state open \
            --json number --jq 'length')

          if [ "$existing" -gt 0 ]; then
            echo "PR de '$branch' para 'develop' já existe."
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --base develop \
            --head "$branch" \
            --title "$branch" \
            --body "PR aberta automaticamente pelo CI a partir da branch \`$branch\`."
